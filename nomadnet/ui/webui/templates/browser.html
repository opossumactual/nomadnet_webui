{% extends "base.html" %}

{% block title %}NomadNet - Browser{% endblock %}

{% block content %}
<div class="browser">
    <div class="browser-toolbar">
        <button onclick="history.back()" title="Back" aria-label="Go back">&larr;</button>
        <button onclick="history.forward()" title="Forward" aria-label="Go forward">&rarr;</button>
        <button hx-get="{{ request.url.path }}" hx-target="#page-content" title="Refresh">&#8635;</button>

        <form class="url-bar" action="/browse" method="get" onsubmit="return navigateTo(this)">
            <input type="text" name="url" id="url-input"
                   value="{{ destination }}{{ path }}"
                   placeholder="destination_hash/path">
            <button type="submit">Go</button>
        </form>

        <button onclick="clearCache()" title="Clear page cache" class="btn-clear-cache">Clear Cache</button>
    </div>

    <div class="browser-status" id="browser-status">
        <span class="status-{{ status }}">{{ status }}</span>
    </div>

    <div class="browser-content" id="page-content">
        {{ content | safe }}
    </div>
</div>

<script>
function navigateTo(form) {
    const url = form.url.value.trim();
    if (url) {
        window.location.href = '/browse/' + url;
    }
    return false;
}

function clearCache() {
    var csrfToken = '{{ csrf_token }}';
    fetch('/browse/cache/clear', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ csrf_token: csrfToken })
    })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Page cache cleared');
            } else {
                alert('Failed to clear cache');
            }
        })
        .catch(err => {
            alert('Error clearing cache: ' + err);
        });
}
</script>
{% endblock %}
