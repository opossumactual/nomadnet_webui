<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NomadNet{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <nav>
        <div class="nav-brand">NomadNet</div>
        <div class="nav-links">
            <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Home</a>
            <a href="/network" {% if request.url.path.startswith('/network') %}class="active"{% endif %}>Network</a>
            <a href="/browse" {% if request.url.path.startswith('/browse') %}class="active"{% endif %}>Browser</a>
            <a href="/conversations" {% if request.url.path.startswith('/conversations') %}class="active"{% endif %}>
                Conversations
                <span id="unread-badge" class="badge" style="display: none;">0</span>
            </a>
        </div>
        {% if request.app.state.config.requires_auth %}
        <div class="nav-auth">
            <a href="/logout">Logout</a>
        </div>
        {% endif %}
    </nav>

    <main id="content">
        {% block content %}{% endblock %}
    </main>

    <footer id="status-bar">
        <span id="connection-status" class="status-disconnected">Disconnected</span>
        <span id="status-text">Ready</span>
    </footer>

    <script>
        // WebSocket connection for real-time updates
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = function() {
                console.log('WebSocket connected');
                document.getElementById('connection-status').className = 'status-connected';
                document.getElementById('connection-status').textContent = 'Connected';
                reconnectAttempts = 0;
            };

            ws.onclose = function() {
                console.log('WebSocket disconnected');
                document.getElementById('connection-status').className = 'status-disconnected';
                document.getElementById('connection-status').textContent = 'Disconnected';

                // Attempt to reconnect
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    setTimeout(connectWebSocket, 2000 * reconnectAttempts);
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };
        }

        function handleWebSocketMessage(data) {
            switch(data.type) {
                case 'announce_stream':
                    updateAnnounceStream(data.announces);
                    break;
                case 'unread_count':
                    updateUnreadBadge(data.count);
                    break;
                case 'new_message':
                    handleNewMessage(data);
                    break;
                case 'new_message_detail':
                    handleNewMessageDetail(data);
                    break;
                case 'conversations_updated':
                    handleConversationsUpdated(data);
                    break;
                case 'page_status':
                    updatePageStatus(data.status);
                    break;
                case 'pong':
                    // Keep-alive response
                    break;
            }
        }

        function handleNewMessage(data) {
            console.log('New message in conversation:', data.conversation_hash);
            // If we're viewing this specific conversation, reload to show new message
            const currentPath = window.location.pathname;
            if (currentPath === '/conversations/' + data.conversation_hash) {
                window.location.reload();
            }
        }

        function handleNewMessageDetail(data) {
            console.log('New message detail:', data);
            // Show toast notification if not currently viewing this conversation
            const currentPath = window.location.pathname;
            const isViewingConversation = currentPath === '/conversations/' + data.conversation_hash;

            if (!isViewingConversation) {
                showToast(
                    data.sender_name || data.conversation_hash.substring(0, 16) + '...',
                    data.content_preview || '',
                    '/conversations/' + data.conversation_hash
                );
            } else {
                // Reload to show the new message
                window.location.reload();
            }
        }

        function handleConversationsUpdated(data) {
            const currentPath = window.location.pathname;
            // Only auto-reload if on the main conversations list
            // Individual conversation views are handled by new_message_detail
            if (currentPath === '/conversations' || currentPath === '/conversations/') {
                window.location.reload();
            }
        }

        function showToast(title, message, link) {
            // Create toast element with fallbacks for undefined values
            const safeTitle = title || 'New Message';
            const safeMessage = message || '';
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <div class="toast-header">${escapeHtml(safeTitle)}</div>
                <div class="toast-body">${escapeHtml(safeMessage.substring(0, 80))}${safeMessage.length > 80 ? '...' : ''}</div>
            `;

            if (link) {
                toast.style.cursor = 'pointer';
                toast.onclick = function() {
                    window.location.href = link;
                };
            }

            // Add to page
            document.body.appendChild(toast);

            // Trigger animation
            setTimeout(function() {
                toast.classList.add('show');
            }, 10);

            // Auto-remove after 5 seconds
            setTimeout(function() {
                toast.classList.remove('show');
                setTimeout(function() {
                    toast.remove();
                }, 300);
            }, 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateAnnounceStream(announces) {
            const container = document.getElementById('announce-stream');
            if (!container) return;

            container.innerHTML = '';
            announces.forEach(function(announce) {
                const entry = document.createElement('a');
                entry.href = '/browse/' + announce.hash;
                entry.className = 'announce-entry announce-' + announce.type;

                const time = new Date(announce.timestamp * 1000).toLocaleTimeString();
                const name = announce.name || announce.hash.substring(0, 16) + '...';
                const typeLabel = {'peer': 'Peer', 'node': 'Node', 'pn': 'Prop.Node'}[announce.type] || announce.type;

                entry.innerHTML = `
                    <span class="announce-time">${time}</span>
                    <span class="announce-type">${typeLabel}</span>
                    <span class="announce-name">${name}</span>
                    <code class="announce-hash">${announce.hash.substring(0, 16)}...</code>
                    <span class="announce-actions">
                        <span onclick="event.preventDefault(); window.location='/conversations/${announce.hash}'" class="announce-action" title="Message">&#9993;</span>
                        <span class="announce-action" title="Browse">&#8594;</span>
                    </span>
                `;
                container.appendChild(entry);
            });
        }

        function updateUnreadBadge(count) {
            const badge = document.getElementById('unread-badge');
            if (badge) {
                if (count > 0) {
                    badge.textContent = count;
                    badge.style.display = 'inline';
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        function updatePageStatus(status) {
            const statusEl = document.getElementById('status-text');
            if (statusEl) {
                statusEl.textContent = status;
            }
        }

        // Connect on page load
        document.addEventListener('DOMContentLoaded', connectWebSocket);

        // Send ping every 30 seconds to keep connection alive
        setInterval(function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send('ping');
            }
        }, 30000);
    </script>
</body>
</html>
