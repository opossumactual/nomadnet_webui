<!DOCTYPE html>
<html lang="en" data-theme="signal" data-effect="waveform">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}NomadNet{% endblock %}</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NomadNet">
    <link rel="apple-touch-icon" href="/static/icons/icon-180.png">

    <!-- Theme color for Android/browsers -->
    <meta name="theme-color" content="#0f0f0f">

    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <nav>
        <div class="nav-brand">NomadNet</div>
        <div class="nav-links">
            <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Home</a>
            <a href="/network" {% if request.url.path.startswith('/network') %}class="active"{% endif %}>Network</a>
            <a href="/browse" {% if request.url.path.startswith('/browse') %}class="active"{% endif %}>Browser</a>
            <a href="/conversations" {% if request.url.path.startswith('/conversations') %}class="active"{% endif %}>
                Conversations
                <span id="unread-badge" class="badge" style="display: none;" aria-label="Unread message count">0</span>
            </a>
            <a href="/settings" {% if request.url.path.startswith('/settings') %}class="active"{% endif %}>Settings</a>
        </div>
        {% if request.app.state.config.requires_auth %}
        <div class="nav-auth">
            <a href="/logout">Logout</a>
        </div>
        {% endif %}
    </nav>

    <main id="content">
        {% block content %}{% endblock %}
    </main>

    <footer id="status-bar">
        <span id="connection-status" class="status-disconnected">Disconnected</span>
        <span id="status-text">Ready</span>
    </footer>

    <script>
        // Theme and Effect Management
        (function() {
            // Apply saved theme/effect immediately to prevent flash
            const savedTheme = localStorage.getItem('nomadnet-theme') || 'signal';
            const savedEffect = localStorage.getItem('nomadnet-effect') || 'waveform';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.documentElement.setAttribute('data-effect', savedEffect);
        })();

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('nomadnet-theme', theme);
        }

        function setEffect(effect) {
            document.documentElement.setAttribute('data-effect', effect);
            localStorage.setItem('nomadnet-effect', effect);
        }

        function getTheme() {
            return localStorage.getItem('nomadnet-theme') || 'signal';
        }

        function getEffect() {
            return localStorage.getItem('nomadnet-effect') || 'waveform';
        }

        // Real-time updates: WebSocket with polling fallback
        let ws = null;
        let reconnectAttempts = 0;
        let reconnectTimer = null;
        let pollingTimer = null;
        let usePolling = false;
        let wsFailCount = 0;

        function connectWebSocket() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            // After 3 failed WebSocket attempts, switch to polling
            if (wsFailCount >= 3) {
                if (!usePolling) {
                    usePolling = true;
                    startPolling();
                }
                return;
            }

            if (ws && ws.readyState === WebSocket.OPEN) return;
            if (ws && ws.readyState === WebSocket.CONNECTING) return;

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = function() {
                document.getElementById('connection-status').className = 'status-connected';
                document.getElementById('connection-status').textContent = 'Connected';
                reconnectAttempts = 0;
                wsFailCount = 0;
                usePolling = false;
                stopPolling();
            };

            ws.onclose = function() {
                document.getElementById('connection-status').className = 'status-disconnected';
                document.getElementById('connection-status').textContent = 'Polling';
                ws = null;
                wsFailCount++;
                reconnectAttempts++;
                var delay = Math.min(2000 * reconnectAttempts, 30000);
                reconnectTimer = setTimeout(connectWebSocket, delay);
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                } catch (e) {
                    console.error('Failed to parse WebSocket message:', e);
                }
            };
        }

        // Polling fallback for browsers where WebSocket is unreliable
        function startPolling() {
            if (pollingTimer) return;
            document.getElementById('connection-status').className = 'status-connected';
            document.getElementById('connection-status').textContent = 'Polling';
            pollForUpdates();
            pollingTimer = setInterval(pollForUpdates, 5000);
        }

        function stopPolling() {
            if (pollingTimer) {
                clearInterval(pollingTimer);
                pollingTimer = null;
            }
        }

        var lastAnnounceCount = -1;
        function pollForUpdates() {
            fetch('/api/updates')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.announces && data.announces.length !== lastAnnounceCount) {
                        lastAnnounceCount = data.announces.length;
                        updateAnnounceStream(data.announces);
                    }
                    if (typeof data.unread_count !== 'undefined') {
                        updateUnreadBadge(data.unread_count);
                    }
                })
                .catch(function(e) {
                    console.error('Poll error:', e);
                });
        }

        // Custom message handler registry - pages can register handlers for specific event types
        var wsMessageHandlers = {};

        function addWsMessageHandler(eventType, handler) {
            if (!wsMessageHandlers[eventType]) {
                wsMessageHandlers[eventType] = [];
            }
            wsMessageHandlers[eventType].push(handler);
        }

        function callCustomHandlers(eventType, data) {
            var handlers = wsMessageHandlers[eventType] || [];
            var handled = false;
            for (var i = 0; i < handlers.length; i++) {
                try {
                    handlers[i](data);
                    handled = true;
                } catch (e) {
                    console.error('Handler error:', e);
                }
            }
            return handled;
        }

        function handleWebSocketMessage(data) {
            // First try custom handlers
            var handled = callCustomHandlers(data.type, data);

            // Then handle built-in types
            switch(data.type) {
                case 'announce_stream':
                    updateAnnounceStream(data.announces);
                    break;
                case 'unread_count':
                    updateUnreadBadge(data.count);
                    break;
                case 'new_message':
                    handleNewMessage(data, handled);
                    break;
                case 'new_message_detail':
                    handleNewMessageDetail(data, handled);
                    break;
                case 'conversations_updated':
                    handleConversationsUpdated(data, handled);
                    break;
                case 'conversation_read':
                    handleConversationRead(data);
                    break;
                case 'page_status':
                    updatePageStatus(data.status);
                    break;
                case 'pong':
                    // Keep-alive response
                    break;
            }
        }

        function handleNewMessage(data, customHandled) {
            // Custom handlers take priority - don't reload if they handled it
            if (customHandled) return;

            console.log('New message in conversation:', data.conversation_hash);
        }

        function handleConversationRead(data) {
            // Remove unread indicator from sidebar
            var convLink = document.querySelector('.conv-list a[href="/conversations/' + data.conversation_hash + '"]');
            if (convLink) {
                var li = convLink.parentElement;
                if (li) {
                    li.classList.remove('unread');
                }
                var indicator = convLink.querySelector('.unread-indicator');
                if (indicator) {
                    indicator.remove();
                }
            }
        }

        function handleNewMessageDetail(data, customHandled) {
            // Show toast notification if not currently viewing this conversation
            var currentPath = window.location.pathname;
            var isViewingConversation = currentPath === '/conversations/' + data.conversation_hash;

            if (!isViewingConversation) {
                showToast(
                    data.sender_name || data.conversation_hash.substring(0, 16) + '...',
                    data.content_preview || '',
                    '/conversations/' + data.conversation_hash
                );
            }
            // Don't reload - let custom handlers update the UI dynamically
        }

        function handleConversationsUpdated(data, customHandled) {
            // Custom handlers take priority
            if (customHandled) return;

            var currentPath = window.location.pathname;
            // Only auto-reload if on the main conversations list
            if (currentPath === '/conversations' || currentPath === '/conversations/') {
                window.location.reload();
            }
        }

        function showToast(title, message, link) {
            // Create toast element with fallbacks for undefined values
            const safeTitle = title || 'New Message';
            const safeMessage = message || '';
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <div class="toast-header">${escapeHtml(safeTitle)}</div>
                <div class="toast-body">${escapeHtml(safeMessage.substring(0, 80))}${safeMessage.length > 80 ? '...' : ''}</div>
            `;

            if (link) {
                toast.style.cursor = 'pointer';
                toast.onclick = function() {
                    window.location.href = link;
                };
            }

            // Add to page
            document.body.appendChild(toast);

            // Trigger animation
            setTimeout(function() {
                toast.classList.add('show');
            }, 10);

            // Auto-remove after 5 seconds
            setTimeout(function() {
                toast.classList.remove('show');
                setTimeout(function() {
                    toast.remove();
                }, 300);
            }, 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateAnnounceStream(announces) {
            const container = document.getElementById('announce-stream');
            if (!container) return;

            container.innerHTML = '';
            announces.forEach(function(announce) {
                const entry = document.createElement('div');
                entry.className = 'announce-entry announce-' + announce.type;
                entry.onclick = function() {
                    if (typeof showNodeInfo === 'function') {
                        showNodeInfo(announce.hash);
                    } else {
                        window.location = '/browse/' + announce.hash;
                    }
                };

                const time = new Date(announce.timestamp * 1000).toLocaleTimeString();
                const name = announce.name || announce.hash.substring(0, 16) + '...';
                const typeLabel = {'peer': 'Peer', 'node': 'Node', 'pn': 'Prop.Node'}[announce.type] || announce.type;

                entry.innerHTML = `
                    <span class="announce-time">${escapeHtml(time)}</span>
                    <span class="announce-type">${escapeHtml(typeLabel)}</span>
                    <span class="announce-name">${escapeHtml(name)}</span>
                    <code class="announce-hash">${escapeHtml(announce.hash)}</code>
                    <span class="announce-actions">
                        <span onclick="event.stopPropagation(); window.location='/conversations/${encodeURIComponent(announce.hash)}'" class="announce-action" title="Message">&#9993;</span>
                        <span onclick="event.stopPropagation(); window.location='/browse/${encodeURIComponent(announce.hash)}'" class="announce-action" title="Browse">&#8594;</span>
                    </span>
                `;
                container.appendChild(entry);
            });
        }

        function updateUnreadBadge(count) {
            const badge = document.getElementById('unread-badge');
            if (badge) {
                if (count > 0) {
                    badge.textContent = count;
                    badge.style.display = 'inline';
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        function updatePageStatus(status) {
            const statusEl = document.getElementById('status-text');
            if (statusEl) {
                statusEl.textContent = status;
            }
        }

        // Connect on page load
        document.addEventListener('DOMContentLoaded', connectWebSocket);

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(function(reg) {
                    console.log('Service worker registered, scope:', reg.scope);
                })
                .catch(function(err) {
                    console.log('Service worker registration failed:', err);
                });
        }

        // Send ping every 15 seconds to keep connection alive
        setInterval(function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send('ping');
            }
        }, 15000);
    </script>
</body>
</html>
